name: Build immortalwrt-mt798x for iKuai Q3000

# Usage:
# 1. Create a new GitHub repo, copy the whole content of this package
#    (the .github/ and q3000/ directories) into the repo root and push.
# 2. Open the repo on GitHub -> Actions -> "Build immortalwrt-mt798x for iKuai Q3000"
#    -> Run workflow.
# 3. When it finishes, download the firmware from the Artifacts section:
#    - immortalwrt-...-ikuai_q3000-...-factory.bin    (flash via U-Boot web recovery)
#    - immortalwrt-...-ikuai_q3000-...-sysupgrade.bin (upgrade from LuCI / sysupgrade)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x.git
  REPO_BRANCH: openwrt-21.02
  TZ: Asia/Shanghai

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout patch files
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell || true
          sudo docker image prune -af || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Clone immortalwrt-mt798x source
        run: git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt

      - name: Apply iKuai Q3000 support
        run: |
          cd openwrt
          python3 "$GITHUB_WORKSPACE/q3000/patch_q3000.py"

      - name: Update and install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load configuration
        run: |
          cd openwrt
          # 官方 mt7981 配置模板（含正确的 WARP 版本、WiFi 驱动、LuCI 等）
          cp -f defconfig/mt7981-ax3000.config .config
          # 叠加 Q3000 设备支持
          cat "$GITHUB_WORKSPACE/q3000/q3000-overlay.config" >> .config
          make defconfig
          grep -E 'ikuai_q3000|WARP_VERSION|WARP_CHIPSET' .config

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 || make -j1 V=s

      - name: Publish firmware to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: q3000-build-${{ github.run_number }}
          name: iKuai Q3000 firmware (build ${{ github.run_number }})
          body: |
            immortalwrt-mt798x (`openwrt-21.02`) firmware for iKuai Q3000,
            built from commit `${{ github.sha }}` of the patch repo.
            - `*factory.bin` — flash via U-Boot web recovery (192.168.1.1)
            - `*sysupgrade.bin` — upgrade from LuCI / sysupgrade
          files: openwrt/bin/targets/mediatek/mt7981/*q3000*.bin
